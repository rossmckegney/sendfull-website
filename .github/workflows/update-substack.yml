name: Update Substack cards

on:
  schedule:
    # Daily at 14:00 UTC.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # A push authenticated as GITHUB_TOKEN does not start the dynamic
  # pages-build-deployment workflow that publishes this legacy Pages site
  # (branch main, folder /). pages: write is what lets this job request
  # that build itself. https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
  pages: write

concurrency:
  group: update-substack-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Update newsletter cards
        run: python3 scripts/update_substack.py

      - name: Commit and push if the cards changed
        id: commit
        run: |
          shopt -s nullglob
          git add -- index.html assets/substack-*.jpg
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "index.html and cover images are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Substack cards"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages-build.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          cat /tmp/pages-build.json
          echo
          if [ "$code" != "201" ] && [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "Pages build request failed with HTTP ${code}" >&2
            exit 1
          fi
